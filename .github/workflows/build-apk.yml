name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.37" setuptools

      - name: Regenerar contenido (temario + preguntas)
        run: python tools/build_content.py

      - name: Caché de Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}

      - name: Construir APK
        working-directory: app
        run: yes | buildozer -v android debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PME-Conductor-E2-APK
          path: app/bin/*.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PME Conductor E2 · versión 1.0.${{ github.run_number }}
          body: |
            APK de la app de estudio para la oposición de Conductor/a E2 del Parque Móvil del Estado.
            Descarga el archivo .apk desde el móvil Android y ábrelo para instalarlo
            (puede pedir permitir "instalar apps de fuentes desconocidas").
          files: app/bin/*.apk
